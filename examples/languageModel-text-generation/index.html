<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ml5.js languageModel Text Generation Example</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="../../dist/ml5.js"></script>
  </head>

  <body>
    <h1>On-Device Text Generation with ml5.languageModel</h1>
    <p>
      This example loads Gemma 4 E2B IT in the browser using Google LiteRT-LM
      and WebGPU. First download (~1.9 GB) is cached in the browser's Origin
      Private File System (OPFS) for instant reloads.
    </p>
    <script src="sketch.js"></script>
  </body>
</html>
